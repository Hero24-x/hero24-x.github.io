<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sign Up | Baha Labs</title>
<link rel="stylesheet" href="css/auth.css">
</head>

<body class="auth-body">

<div class="auth-box">

    <h1>Sign Up</h1>
    <p>Create your account</p>

    <input type="text" placeholder="Username" id="suUser">
    <input type="email" placeholder="Email" id="suEmail">
    <input type="password" placeholder="Password" id="suPass">

    <button onclick="signup()">Create Account</button>

    <p class="switch">
        Already have account?
        <a href="login.html">Login</a>
    </p>

</div>

<script>
function signup(){
    fetch("http://localhost:3000/signup", {
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body: JSON.stringify({
            username: document.getElementById("suUser").value,
            email: document.getElementById("suEmail").value,
            password: document.getElementById("suPass").value
        })
    })
    .then(res => res.json())
    .then(data => alert(data.message));
}
</script>

</body>
</html>
